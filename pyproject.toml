[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "invesk"
version = "0.1.0"
description = "Understand a fund before you invest in it: extract holdings, search the news, and synthesize a level-adjusted report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FR2: fund data extraction (Yahoo Finance, no API key)
    "yfinance==1.8.0",
    # FR3: news search via the Exa SDK (contracts/exa.v1.md)
    "exa-py==2.28.0",
    # FR4: LLM synthesis via the Ollama Python client (contracts/ollama.v1.md)
    "ollama==0.6.3",
    # FR5: colored report sections in interactive terminals
    "colorama==0.4.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: calls real Exa or Ollama boundaries; run manually with pytest -m smoke",
]
